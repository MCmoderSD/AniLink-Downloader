<div class="tree" role="tree" aria-label="Folders" (keydown)="keydown($event)">
  @for (item of items(); track item.path; let index = $index) {
    <div
      class="tree-item"
      role="treeitem"
      [class.tree-item-current]="item.current"
      [attr.data-index]="index"
      [attr.aria-label]="item.label"
      [attr.aria-level]="item.level"
      [attr.aria-expanded]="item.expandable ? item.open : null"
      [attr.aria-selected]="item.current"
      [attr.tabindex]="item.path === stop() ? 0 : -1"
      [style.padding-inline-start.rem]="0.25 + (item.level - 1) * 1"
      (click)="activate(item)"
      (focus)="focused.set(item.path)"
    >
      <span class="tree-chevron" aria-hidden="true" (click)="toggle($event, item)">
        @if (item.expandable) {
          <mat-icon class="tree-chevron-icon">{{ item.open ? 'expand_more' : 'chevron_right' }}</mat-icon>
        }
      </span>

      <mat-icon class="tree-icon" aria-hidden="true">{{ item.icon }}</mat-icon>
      <span class="tree-name" [attr.title]="item.name">{{ item.name }}</span>
    </div>
  }
</div>
