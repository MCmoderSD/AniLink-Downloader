<h2 mat-dialog-title>Archive password</h2>

<mat-dialog-content class="password-prompt" #content>
  <p class="password-prompt-text">
    None of the known passwords opens the archive of <strong>{{ data.jobName }}</strong>
    ({{ summary }}). Enter the password and the unpacking is tried again.
  </p>

  <mat-form-field appearance="outline" class="password-prompt-field">
    <mat-label>Password</mat-label>
    <input
      matInput
      [type]="visible() ? 'text' : 'password'"
      autocomplete="off"
      spellcheck="false"
      (input)="type($event)"
      (keydown.enter)="submit()"
    />
    <button
      mat-icon-button
      matSuffix
      type="button"
      [attr.aria-label]="visible() ? 'Hide password' : 'Show password'"
      [attr.aria-pressed]="visible()"
      (click)="toggleVisible()"
    >
      <mat-icon aria-hidden="true">{{ visible() ? 'visibility_off' : 'visibility' }}</mat-icon>
    </button>
  </mat-form-field>

  <app-scroll-bar [target]="content" />
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button mat-flat-button type="button" [disabled]="!valid()" (click)="submit()">Try password</button>
</mat-dialog-actions>
