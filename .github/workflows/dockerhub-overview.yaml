name: Docker Hub Overview

on:
  push:
    branches: [master, main]
    paths:
      - OVERVIEW.md
      - .github/workflows/dockerhub-overview.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: anilink-downloader

jobs:
  overview:
    name: Publish OVERVIEW.md on Docker Hub
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch

    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: publish
        name: Set OVERVIEW.md as the repository overview
        uses: peter-evans/dockerhub-description@v5.0.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          readme-filepath: ./OVERVIEW.md