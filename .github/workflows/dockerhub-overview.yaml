name: Docker Hub Overview

on:
  push:
    branches: [master, main]
    paths:
      - OVERVIEW.md
      - .github/workflows/dockerhub-overview.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: anilink-downloader

jobs:
  overview:
    name: Publish OVERVIEW.md on Docker Hub
    runs-on: ubuntu-latest

    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: publish
        name: Set OVERVIEW.md as the repository overview
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ "$REF_TYPE" != branch ] || [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "::error::The overview is only published from '$DEFAULT_BRANCH', not from '$REF_NAME'."
            exit 1
          fi
          : "${DOCKERHUB_USERNAME:?The repository variable DOCKERHUB_USERNAME is not set}"
          : "${DOCKERHUB_TOKEN:?The repository secret DOCKERHUB_TOKEN is not set}"

          limit=25000
          size="$(wc -c < OVERVIEW.md)"
          if [ "$size" -gt "$limit" ]; then
            echo "::error::OVERVIEW.md has ${size} bytes, but Docker Hub takes at most ${limit}."
            exit 1
          fi

          response="$(mktemp)"
          fail() {
            echo "::error::$1 (HTTP $2). Docker Hub says: $(jq -r '.message // empty' "$response" 2>/dev/null | tr '\r\n' '  ' | head -c 200)"
            exit 1
          }

          status="$(jq -n --arg identifier "$DOCKERHUB_USERNAME" --arg secret "$DOCKERHUB_TOKEN" '{identifier: $identifier, secret: $secret}' |
            curl -sS -o "$response" -w '%{http_code}' -X POST https://hub.docker.com/v2/auth/token \
              -H 'Content-Type: application/json' --data @-)"
          if [ "$status" != 200 ]; then fail "Docker Hub did not accept the login" "$status"; fi

          token="$(jq -r '.access_token // empty' "$response")"
          if [ -z "$token" ]; then
            echo "::error::The login answer of Docker Hub has no access token."
            exit 1
          fi
          echo "::add-mask::${token}"

          status="$(jq -n --rawfile overview OVERVIEW.md '{full_description: $overview}' |
            curl -sS -o "$response" -w '%{http_code}' -X PATCH "https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/${IMAGE_NAME}" \
              -H "Authorization: Bearer ${token}" -H 'Content-Type: application/json' --data @-)"
          if [ "$status" != 200 ]; then
            fail "Docker Hub did not accept the overview. For 401 and 403 the token needs the scope Read, Write and Delete" "$status"
          fi

          {
            echo "### Docker Hub overview"
            echo
            echo "OVERVIEW.md (${size} bytes) is now the overview of ${DOCKERHUB_USERNAME}/${IMAGE_NAME}."
          } >> "$GITHUB_STEP_SUMMARY"