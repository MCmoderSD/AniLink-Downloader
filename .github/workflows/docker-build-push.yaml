name: Docker Build & Push

# A push to master publishes the image as `edge`. A push whose commit title (or merged pull request title) starts with
# `Release 3.0.0` publishes it as a release: `3.0.0`, `3.0`, `3` and `latest` (a pre-release such as `3.0.0-rc.1` only
# gets its own tag), and sets the git tag `3.0.0`. The version comes from the files that carry it.
on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      release:
        description: Publish the version in the project files as a release, not just as edge
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A release must not be cancelled by a push that comes right after it, such as a Dependabot merge
  cancel-in-progress: ${{ !contains(github.event.head_commit.message, 'Release ') && !inputs.release }}

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: anilink-downloader

jobs:
  version:
    name: Resolve version and tags
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tags: ${{ steps.plan.outputs.tags }}

    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: plan
        name: Resolve the version, the release and the tags
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
          INPUT_RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail

          # The version has to be the same in every file that carries it, or the run stops before anything is built
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' backend/AniLink.Api/AniLink.Api.csproj | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error::backend/AniLink.Api/AniLink.Api.csproj has no <Version>."
            exit 1
          fi

          mismatch=false
          check() {
            if [ "$2" != "$version" ]; then
              echo "::error::$1 says '$2', but AniLink.Api.csproj says '$version'. They must be the same."
              mismatch=true
            fi
          }
          check "frontend/package.json" "$(jq -r '.version' frontend/package.json)"
          check "frontend/package-lock.json" "$(jq -r '.version' frontend/package-lock.json)"
          check "frontend/package-lock.json (packages)" "$(jq -r '.packages[""].version' frontend/package-lock.json)"
          if [ "$mismatch" = true ]; then exit 1; fi

          semver='^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$'
          if ! [[ "$version" =~ $semver ]]; then
            echo "::error::'$version' is not a version like 3.0.0 or 3.0.0-rc.1."
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          prerelease="${BASH_REMATCH[4]}"

          # A release is asked for by a title that starts with "Release 3.0.0": the first line of the commit, or the
          # title of the pull request that was merged (the first line after "Merge pull request ..."). Anything further
          # down in the message is not looked at, so a changelog quoted there cannot start a release. The number has to
          # be the version in the files.
          release=false
          if [ "$EVENT" = workflow_dispatch ]; then
            if [ "$INPUT_RELEASE" = true ]; then release=true; fi
          else
            title="$(printf '%s\n' "$MESSAGE" | head -n 1)"
            case "$title" in
              "Merge pull request "*) title="$(printf '%s\n' "$MESSAGE" | tail -n +2 | grep -m1 -v '^[[:space:]]*$' || true)" ;;
            esac
            marker="$(printf '%s\n' "$title" | grep -Eom1 '^Release [0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?' | cut -d' ' -f2 || true)"
            if [ -n "$marker" ]; then
              if [ "$marker" != "$version" ]; then
                echo "::error::The message says Release $marker, but the files say $version."
                exit 1
              fi
              release=true
            fi
          fi

          # A version is released once: its git tag must not exist yet
          if [ "$release" = true ]; then
            set +e
            git ls-remote --exit-code --tags origin "refs/tags/${version}" > /dev/null
            status=$?
            set -e
            case "$status" in
              0)
                echo "::error::The tag ${version} exists already, so this version has been released. Raise the version first."
                exit 1
                ;;
              2) ;;
              *)
                echo "::error::The tags of the repository could not be looked up (git exit code ${status})."
                exit 1
                ;;
            esac
          fi

          on_default=false
          if [ "$REF_NAME" = master ] || [ "$REF_NAME" = main ]; then on_default=true; fi

          publish=false
          tags=()
          if [ "$release" = true ]; then
            publish=true
            tags+=("$version")
            if [ -z "$prerelease" ]; then tags+=("${major}.${minor}" "$major" latest); fi
          fi
          if [ "$on_default" = true ]; then
            publish=true
            tags+=(edge)
          fi

          {
            echo "publish=${publish}"
            echo "release=${release}"
            echo "version=${version}"
            echo "tags<<TAGS_END"
            for tag in "${tags[@]}"; do echo "type=raw,value=${tag}"; done
            echo "TAGS_END"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Version ${version}"
            echo
            if [ "$publish" = true ]; then
              echo "Publishes: ${tags[*]}"
            else
              echo "Nothing is published: this push is neither on master or main nor a release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: version
    if: needs.version.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64, linux/arm/v7]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          - platform: linux/arm/v7
            runner: ubuntu-latest

    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: prepare
        name: Prepare platform slug and image names
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "slug=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
          echo "ghcr-image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - id: qemu
        name: Set up QEMU
        if: matrix.platform == 'linux/arm/v7'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm

      - id: buildx
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - id: login-dockerhub
        name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: login-ghcr
        name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        name: Generate image metadata
        uses: docker/metadata-action@v6
        with:
          images: |
            docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
            ${{ steps.prepare.outputs.ghcr-image }}
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

      - id: build
        name: Build and push by digest
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: SEVENZIP_REFRESH=${{ github.run_id }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }},${{ steps.prepare.outputs.ghcr-image }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.prepare.outputs.slug }}
          cache-to: type=gha,mode=max,scope=${{ steps.prepare.outputs.slug }}

      - id: export-digest
        name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - id: upload-digest
        name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ steps.prepare.outputs.slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Create manifest list
    runs-on: ubuntu-latest
    needs: [version, build]

    steps:
      - id: download-digests
        name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - id: prepare
        name: Prepare image names
        run: echo "ghcr-image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - id: buildx
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - id: login-dockerhub
        name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: login-ghcr
        name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        name: Generate image metadata
        uses: docker/metadata-action@v6
        with:
          images: |
            docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
            ${{ steps.prepare.outputs.ghcr-image }}
          flavor: latest=false
          tags: ${{ needs.version.outputs.tags }}

      - id: create-manifest
        name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          SOURCE_IMAGE: ${{ steps.prepare.outputs.ghcr-image }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${SOURCE_IMAGE}@sha256:%s " *)

      - id: inspect
        name: Inspect image
        env:
          SOURCE_IMAGE: ${{ steps.prepare.outputs.ghcr-image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "${SOURCE_IMAGE}:${VERSION}"

  tag:
    name: Set the git tag
    runs-on: ubuntu-latest
    needs: [version, merge]
    if: needs.version.outputs.release == 'true'
    permissions:
      contents: write

    steps:
      - id: create-tag
        name: Create the tag on the built commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${VERSION}" -f sha="${GITHUB_SHA}"